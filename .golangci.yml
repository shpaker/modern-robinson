version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - revive
    - depguard
  settings:
    depguard:
      rules:
        # Domain must not depend on any other internal layer or the engine.
        domain:
          files:
            - "**/internal/types/**"
          deny:
            - pkg: github.com/hajimehoshi/ebiten
              desc: Domain (types) must not import the engine
            - pkg: github.com/shpaker/modern-robinson/internal/interfaces
            - pkg: github.com/shpaker/modern-robinson/internal/use_cases
            - pkg: github.com/shpaker/modern-robinson/internal/adapters
            - pkg: github.com/shpaker/modern-robinson/internal/repositories
            - pkg: github.com/shpaker/modern-robinson/internal/app
        # Contracts: only the Domain, never the engine or outer layers.
        contracts:
          files:
            - "**/internal/interfaces/**"
          deny:
            - pkg: github.com/hajimehoshi/ebiten
              desc: interfaces must not import the engine
            - pkg: github.com/shpaker/modern-robinson/internal/adapters
            - pkg: github.com/shpaker/modern-robinson/internal/repositories
            - pkg: github.com/shpaker/modern-robinson/internal/app
            - pkg: github.com/shpaker/modern-robinson/internal/use_cases
        # Application logic: no engine, no presentation/infrastructure/root.
        application:
          files:
            - "**/internal/use_cases/**"
          deny:
            - pkg: github.com/hajimehoshi/ebiten
              desc: use_cases must not import the engine
            - pkg: github.com/shpaker/modern-robinson/internal/adapters
            - pkg: github.com/shpaker/modern-robinson/internal/repositories
            - pkg: github.com/shpaker/modern-robinson/internal/app
        # Presentation may use the engine but not infrastructure/root.
        presentation:
          files:
            - "**/internal/adapters/**"
          deny:
            - pkg: github.com/shpaker/modern-robinson/internal/repositories
            - pkg: github.com/shpaker/modern-robinson/internal/app
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofumpt
