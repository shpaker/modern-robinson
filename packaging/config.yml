# Настройки «Нового Робинзона». Файл целиком необязателен: любой пропущенный
# или неверный ключ — это значение по умолчанию, игра всё равно запустится.
# Положите файл рядом с исполняемым файлом или в папку игры.

scale: 2          # увеличение окна (само окно игры — 640×480), 1..4
sound: 1.0        # громкость звука, 0..1
music: 0.7        # громкость музыки, 0..1
speed: 0.5        # скорость игры, 0..1 (0.5 — как в оригинале)
debug: false      # запускать с отладочным слоем (он же F1)
fullscreen: false # во весь экран (он же F)
crt: true         # ретро-фильтр «ЭЛТ» (он же F3)
# Кинескоп, каждая ручка 0..1:
crt_curvature: 0.75   # выпуклость стекла
crt_scanlines: 0.65   # сканлайны — тёмные промежутки между строками
crt_interlace: 0      # черезстрочность: поля строк по очереди (мерцает)
crt_mask: 0.35        # щелевая маска люминофора
crt_glow: 0.5         # свечение ярких мест
crt_softness: 0.35    # мягкость луча между пикселями
crt_convergence: 0.65 # несведение лучей к краям
crt_vignette: 0.95    # затемнение к углам
crt_noise: 0.8        # шум
crt_hum: 0.75         # катящаяся полоса наводки
crt_flicker: 0.25     # мерцание яркости
# Помехи:
crt_glitches: 90      # сбой в среднем раз в столько секунд, 0 — без сбоев
crt_ripple: true      # рябь при смене локации
crt_case: true        # корпус монитора вокруг картинки в фулскрине
