# Настройки «Нового Робинзона». Файл целиком необязателен: любой пропущенный
# или неверный ключ — это значение по умолчанию, игра всё равно запустится.
# Положите файл рядом с исполняемым файлом или в папку игры.

scale: 2          # увеличение окна (само окно игры — 640×480), 1..4
sound: 1.0        # громкость звука, 0..1
music: 0.7        # громкость музыки, 0..1
speed: 0.5        # скорость игры, 0..1 (0.5 — как в оригинале)
debug: false      # запускать с отладочным слоем (он же F1)
fullscreen: false
