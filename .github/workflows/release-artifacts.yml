name: release-artifacts

# One archive per OS, attached to a release. release-please.yml calls this
# right after it cuts one. By hand: with a tag it re-attaches the archives to
# that release, without one it is a test build kept in the run's artifacts.
# macOS is built on a mac because Ebitengine needs cgo there; Windows
# cross-compiles from Linux with cgo off.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the archives to; empty for a test build"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos
            goos: darwin
            goarch: arm64
            cgo: 1
            binary: robinson_darwin_arm64
          # Pinned: the cgo build inherits the runner's glibc as its floor.
          - os: ubuntu-24.04
            name: linux
            goos: linux
            goarch: amd64
            cgo: 1
            binary: robinson_linux_amd64
          - os: ubuntu-24.04
            name: windows
            goos: windows
            goarch: amd64
            cgo: 0
            binary: robinson_windows_amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Ebitengine system deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          VERSION: ${{ inputs.tag || 'dev' }}
        run: |
          stage="dist/${{ matrix.name }}"
          mkdir -p "$stage"
          go build -trimpath \
            -ldflags "-s -w -X github.com/shpaker/modern-robinson/internal/app.Version=${VERSION}" \
            -o "$stage/${{ matrix.binary }}" ./cmd
          cp README.md THIRD_PARTY.md packaging/config.yml "$stage/"
          ( cd dist && zip -qr "modern-robinson_${VERSION}_${{ matrix.name }}.zip" "${{ matrix.name }}" )
      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/*.zip --clobber
      - uses: actions/upload-artifact@v7
        if: inputs.tag == ''
        with:
          name: modern-robinson-${{ matrix.name }}
          path: dist/*.zip
