name: release-artifacts

# One archive for every desktop system, attached to a release. release-please.yml
# calls this right after it cuts one. By hand: with a tag it re-attaches the
# archive to that release, without one it is a test build kept in the run's
# artifacts. Each binary is built on its own runner: macOS on a mac because
# Ebitengine needs cgo there, Windows cross-compiles from Linux with cgo off.
# The package job then puts the three binaries, the docs, the sample config,
# the game folder's AGENTS.md, the MCP skill, the MCP roles and the game
# folder's .mcp.json into one folder and zips it. .mcp.json has one command for every system:
# ./robinson is a sh launcher that picks the macOS or Linux build, and Windows
# appends .exe to a bare name, hence the Windows build is robinson.exe.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the archive to; empty for a test build"
        type: string
        default: ""

permissions:
  contents: read

env:
  VERSION: ${{ inputs.tag || 'dev' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos
            goos: darwin
            goarch: arm64
            cgo: 1
            binary: robinson_darwin_arm64
          # Pinned: the cgo build inherits the runner's glibc as its floor.
          - os: ubuntu-24.04
            name: linux
            goos: linux
            goarch: amd64
            cgo: 1
            binary: robinson_linux_amd64
          - os: ubuntu-24.04
            name: windows
            goos: windows
            goarch: amd64
            cgo: 0
            binary: robinson.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Ebitengine system deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/shpaker/modern-robinson/internal/app.Version=${VERSION}" \
            -o "dist/${{ matrix.binary }}" ./cmd
      # Only a hand-off to the package job, hence a day: enough to re-run the
      # packing. The artifact drops the exec bit; the package job puts it back.
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.name }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  package:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist/bin
      # One top-level folder named like the archive: unzip does not spill files
      # into the current directory, and Archive Utility on macOS unpacks it as
      # is. Info-ZIP keeps unix modes, so the macOS and Linux binaries stay
      # executable.
      - name: Pack
        run: |
          top="modern-robinson_${VERSION}"
          stage="dist/$top"
          mkdir -p "$stage/skills"
          install -m 0755 dist/bin/robinson_darwin_arm64 \
            dist/bin/robinson_linux_amd64 dist/bin/robinson.exe \
            packaging/robinson "$stage/"
          install -m 0644 README.md THIRD_PARTY.md packaging/config.yml \
            packaging/.mcp.json "$stage/"
          install -m 0644 packaging/AGENTS.md "$stage/AGENTS.md"
          cp -R skills/robinson "$stage/skills/"
          cp -R internal/adapters/mcp/roles "$stage/"
          ( cd dist && zip -qrX "$top.zip" "$top" )
          zipinfo "dist/$top.zip"
      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "dist/modern-robinson_${VERSION}.zip" --clobber
      - uses: actions/upload-artifact@v7
        if: inputs.tag == ''
        with:
          name: modern-robinson-${{ env.VERSION }}
          path: dist/modern-robinson_${{ env.VERSION }}.zip
          if-no-files-found: error
          overwrite: true
